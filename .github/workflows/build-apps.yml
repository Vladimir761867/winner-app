name: Build apps (Android APK + iOS check)
on:
  push:
    paths: ["capacitor/**", ".github/workflows/build-apps.yml"]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    strategy:
      matrix: { app: [pobeditel, junior] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Build debug APK
        working-directory: capacitor/${{ matrix.app }}
        run: |
          npm ci
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-debug-apk
          path: capacitor/${{ matrix.app }}/android/app/build/outputs/apk/debug/*.apk
  ios:
    runs-on: macos-15
    strategy:
      matrix: { app: [pobeditel, junior] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build for iOS Simulator (no signing)
        working-directory: capacitor/${{ matrix.app }}
        run: |
          npm ci
          npx cap sync ios
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -20
