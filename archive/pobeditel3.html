function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended")AC.resume();return AC}
function tone(f,d,ty,v,sl,dl){if(mute)return;const a=ac();if(!a)return;const t0=a.currentTime+(dl||0),o=a.createOscillator(),gn=a.createGain();o.type=ty||"sine";o.frequency.setValueAtTime(f,t0);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,sl),t0+d);gn.gain.setValueAtTime(v||.15,t0);gn.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(gn);gn.connect(a.destination);o.start(t0);o.stop(t0+d+.02)}
function noise(d,v){if(mute)return;const a=ac();if(!a)return;const n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=(Math.random()*2-1)*(1-i/n);const sr=a.createBufferSource(),gn=a.createGain();sr.buffer=b;gn.gain.value=v;sr.connect(gn);gn.connect(a.destination);sr.start()}
const SFX={strike:()=>tone(520,.12,"sawtooth",.08,160),jump:()=>tone(300,.18,"square",.06,700),shoot:()=>tone(900,.2,"triangle",.1,300),
pop:()=>{noise(.18,.15);tone(220,.15,"square",.08,80)},boom:()=>{noise(.38,.28);tone(120,.3,"sawtooth",.14,40)},
coin:()=>{tone(880,.08,"square",.05);tone(1320,.12,"square",.05,0,.07)},hurt:()=>tone(160,.25,"sawtooth",.13,70),
level:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.18,"triangle",.14,0,i*.09)),eat:()=>{tone(660,.08,"sine",.15);tone(990,.14,"sine",.15,0,.08)},
laugh:()=>[700,600,700,600].forEach((f,i)=>tone(f,.07,"square",.06,0,i*.08)),shield:()=>tone(1200,.2,"triangle",.12,400),
day:()=>[392,523,659].forEach((f,i)=>tone(f,.25,"sine",.14,0,i*.12)),over:()=>[392,330,262].forEach((f,i)=>tone(f,.3,"triangle",.12,0,i*.18))};

function LINES(){if(st!=="play")return;g.strokeStyle="rgba(255,255,255,.3)";g.lineWidth=2;for(let i=0;i<6;i++){const x=W-((dist*1.4+i*173*u)%(W+120)),y=GY-(30+i*34)*u;g.beginPath();g.moveTo(x,y);g.lineTo(x+(40+level*4)*u,y);g.stroke()}}
const mb=document.getElementById("mb");function setMute(v){mute=v;try{localStorage.setItem("pobMute",v?"1":"0")}catch(e){}mb.textContent=v?"🔇":"🔊"}

function dayStep(dt){
 dayT+=dt/100;mood=Math.max(0,mood-dt);
 if(dayT>=1){dayT=0;day++;energy=maxE();coins+=5;save();lastPh=0;SFX.day();say("Новый день "+day+"! Энергия снова полная",W/2,H*.3,"#ffffff",28);return}
 const ph=phase();if(ph!==lastPh){lastPh=ph;say(["","Наступил день","Вечер: силы тают — ищи 🍎 и 😂","Ночь: держись, скоро утро"][ph],W/2,H*.38,"#ffe3b0",22)}
 energy-=(.4+2.6*dayT)*(mood>0?.2:1)*dt;
 pt-=dt;if(pt<=0){pt=10-6*dayT+Math.random()*4;const hi=own("jump")&&Math.random()<.4;pk.push({x:W+40,hg:hi?80*u:0,ty:Math.random()<.55?"🍎":"😂",ph:Math.random()*6})}
 for(const q of pk){q.x-=speed()*dt;const cy=GY-26*u-q.hg,hy=GY-jy-38*u*sc();
  if(!q.got&&Math.abs(q.x-px())<34*u*sc()&&Math.abs(cy-hy)<50*u*sc()){q.got=true;
   if(q.ty==="🍎"){SFX.eat();energy=Math.min(maxE(),energy+25);say("Вкусно! +25 энергии",q.x,cy-30*u,"#9ff5c0",22)}
   else{SFX.laugh();energy=Math.min(maxE(),energy+15);mood=8;say("Ха-ха! +15 энергии, ⭐×2",q.x,cy-30*u,"#9ff5c0",20)}
   burst(q.x,cy,"#9ff5c0",18)}}
 pk=pk.filter(q=>!q.got&&q.x>-40);
 if(energy<=0)dieCheck()}
