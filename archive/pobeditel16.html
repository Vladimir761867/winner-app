{id:"dj",n:"Двойной прыжок",d:"Прыгни ещё раз в воздухе — удобно над ямами и стенами",p:40,max:1},
{id:"rapid",n:"Быстрая зарядка шарика",d:"Шарик перезаряжается быстрее",p:40,max:3},
{id:"pierce",n:"Пробивной шарик",d:"Шарик летит насквозь и бьёт несколько проблем сразу",p:70,max:1},
{id:"hp",n:"Запас сил",d:"+20 к максимальной энергии",p:30,max:4},
{id:"kit",n:"Аптечка поддержки",d:"Сама лечит +60, когда энергия на нуле",p:25,max:9},
{id:"shield",n:"Щит поддержки",d:"Блокирует 1 удар, обновляется с уровнем",p:60,max:1}];
const price=i=>i.p+(i.id==="kit"?0:Math.round(i.p*.5*ownR(i.id)));
function renderShop(){shopEl.innerHTML='<div class="box"><h2>Магазин сил</h2><div class="cn">⭐ '+coins+'</div><span>Прыжок, удар и шарик доступны всегда. Здесь — усиления.</span>'+SHOP.map(i=>{const o=ownR(i.id),mx=o>=i.max,pr=price(i);return '<div class="it"><div><b>'+i.n+(i.max>1?' ('+o+'/'+i.max+')':'')+'</b><br><span>'+i.d+'</span></div><button data-id="'+i.id+'"'+((mx||coins<pr)?' disabled':'')+'>'+(mx?'Куплено':'⭐ '+pr)+'</button></div>'}).join('')+'<button class="x" data-x="1">Закрыть</button></div>'}
function renderProf(){const done=ACH.filter(a=>meta.ach[a.id]).length;
 profEl.innerHTML='<div class="box"><h2>Профиль</h2><div class="cn">⭐ '+coins+'</div><div>Звание: <b>'+title()+'</b><br><span>Рекорд: '+meta.best+' · Уровень: '+level+' · Побед всего: '+meta.total+' · Серия: '+meta.streak+' дн.</span></div>'
 +'<h3>Задания на сегодня</h3>'+meta.quests.map(q=>'<div class="it"><div style="flex:1"><b>'+(q.d?'✅ ':'')+qText(q)+'</b><br><span>'+Math.min(q.p,q.n)+'/'+q.n+' · награда ⭐ '+Math.round(q.r*(q.m||1))+'</span><div class="pb"><i style="width:'+Math.min(100,q.p/q.n*100)+'%"></i></div></div></div>').join('')
 +'<h3>Достижения ('+done+'/'+ACH.length+')</h3>'+ACH.map(a=>'<div class="it"><div><b>'+(meta.ach[a.id]?'🏅 ':'🔒 ')+a.n+'</b><br><span>Звание: «'+a.ti+'» · +10 ⭐</span></div></div>').join('')
 +'<h3>Скины героя</h3>'+SKINS.map((s,i)=>{const o2=meta.skins[i],cur=meta.skin===i;return '<div class="it"><b>'+s.n+'</b><button data-sk="'+i+'"'+(cur||(!o2&&coins<s.p)?' disabled':'')+'>'+(cur?'Надет':o2?'Надеть':'⭐ '+s.p)+'</button></div>'}).join('')
 +'<button class="x" data-x="1">Закрыть</button></div>'}
function openShop(){shopOpen=true;renderShop();shopEl.style.display="block"}
const besEl=document.getElementById("bes");
function openBes(){const all=ALLN(),tot=Object.values(all).reduce((a,l)=>a+l.length,0),got=Object.keys(meta.seen).length;let h='<div class="box"><h2>📖 Коллекция проблем</h2><div class="cn">Открыто: '+got+' из '+tot+'</div><span>Побеждай проблемы, чтобы открывать их здесь. Награды: '+MS.map(m=>m[0]+"→⭐"+m[1]).join(" · ")+'</span>';THEMES.forEach(T=>{const l=all[T.id],g2=l.filter(n=>meta.seen[n]).length;h+='<h3>'+T.ic+" "+T.n+" · "+g2+"/"+l.length+'</h3><div style="display:flex;flex-wrap:wrap;gap:5px">'+l.map(n=>{const c=meta.seen[n],b=T.boss.includes(n);return c?'<span style="background:'+(b?"#7a4ad9":"#3a4a8a")+';padding:3px 7px;border-radius:9px;font-size:12px">'+(b?"👑 ":"")+n+" ×"+c+"</span>":'<span style="background:#2a2a40;opacity:.55;padding:3px 7px;border-radius:9px;font-size:12px">???</span>'}).join("")+"</div>"});besEl.innerHTML=h+'<button class="x" data-x="1">Закрыть</button></div>';besEl.style.display="block"}
besEl.onclick=e=>{const b=e.target.closest("button");if(b&&b.dataset.x){besEl.style.display="none"}};
function openProf(){profOpen=true;renderProf();profEl.style.display="block"}
function closeAll(){shopOpen=profOpen=false;shopEl.style.display=profEl.style.display=besEl.style.display="none";if(st==="menu")showMenu();else if(st==="over")showEnd()}
shopEl.onclick=e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.x){closeAll();return}const i=SHOP.find(x=>x.id===b.dataset.id);if(!i)return;const pr=price(i);if(coins>=pr&&ownR(i.id)<i.max){coins-=pr;inv[i.id]=ownR(i.id)+1;save();renderShop()}};
profEl.onclick=e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.x){closeAll();return}const i=+b.dataset.sk,s=SKINS[i];if(!s)return;
 if(meta.skins[i]){meta.skin=i;save();renderProf()}else if(coins>=s.p){coins-=s.p;meta.skins[i]=1;meta.skin=i;save();renderProf()}};
skipB.onclick=skipTut;
showMenu();requestAnimationFrame(loop);
</script></body></html>
