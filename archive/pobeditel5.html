function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended")AC.resume();return AC}
function tone(f,d,ty,v,sl,dl){if(mute)return;const a=ac();if(!a)return;const t0=a.currentTime+(dl||0),o=a.createOscillator(),gn=a.createGain();o.type=ty||"sine";o.frequency.setValueAtTime(f,t0);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,sl),t0+d);gn.gain.setValueAtTime(v||.15,t0);gn.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(gn);gn.connect(a.destination);o.start(t0);o.stop(t0+d+.02)}

 t+=dt;shake=Math.max(0,shake-dt);flash=Math.max(0,flash-dt*1.5);hurtT=Math.max(0,hurtT-dt);bn.t-=dt;

  if(jy===0&&Math.random()<.5)parts.push({x:px()-10*u,y:GY-2*u,vx:-60*u,vy:-30*u,l:.4,c:"rgba(255,255,255,.7)",r:2.5*u});
  if(tut>=9&&energy<maxE()*.3){beat-=dt;if(beat<=0){beat=.45+energy/maxE();tone(70,.12,"sine",.2,45);tone(70,.12,"sine",.14,45,.16)}if(Math.random()<dt*4)parts.push({x:px()-6*u,y:GY-jy-70*u*sc(),vx:-30*u,vy:20*u,l:.6,c:"rgba(150,210,255,.9)",r:2.5*u})}
  if(!recShown&&meta.best>3&&run>meta.best){recShown=true;say("🏆 Новый рекорд!",W/2,H*.35,"#ffe27a",30);SFX.level();confetti(W/2,H*.3)}
  if(tut>=9&&st==="play"){spawn-=dt;const bossOn=probs.some(p=>p.boss&&!p.dead);
   if(bossPending&&!queue.length&&!probs.length&&!bossOn){bossPending=false;spawnBoss()}

   for(const q of queue){q.t-=dt;if(q.t<=0){q.go=1;spawnT(q.ty)}}queue=queue.filter(q=>!q.go)}
  for(const b of bullets){b.x+=900*u*dt;for(const p of probs){if(!p.dead&&!b.d&&b.x>p.x-p.w/2&&!(b.h&&b.h.includes(p))){if(own("pierce"))(b.h=b.h||[]).push(p);else b.d=true;p.hp--;p.flash=1;if(p.hp<=0)defeat(p,0,1);else burst(p.x,GY-p.h/2-(p.fh||0),"#fff",8)}}}
  bullets=bullets.filter(b=>!b.d&&b.x<W+40);
  for(const p of probs){if(p.dead)continue;p.flash=Math.max(0,p.flash-dt*5);

 +THEMES.map((T,i)=>'<button class="card" data-th="'+i+'" style="background:linear-gradient(160deg,'+T.c[0]+','+T.c[1]+')"><i>'+T.ic+'</i><b>'+T.n+'</b><span>'+T.tag+'</span><span>рекорд: '+(meta.bestBy[T.id]||0)+'</span></button>').join('')
 +'</div><p style="font-size:13px;opacity:.85">'+(meta.tut?'Внизу экрана кнопки: ⬆️ ПРЫЖОК · 👊 УДАР · ✨ ЛУЧ':'Сначала короткое обучение (его можно пропустить)')+'</p><div class="row"><button data-a="shop">🛒 Магазин</button><button data-a="prof">🏅 Профиль и задания</button><button data-a="mute">'+(mute?"🔇 Звук выключен":"🔊 Звук включён")+'</button></div></div>';
 menuEl.style.display="flex"}
function showEnd(){menuEl.style.display="none";
 endEl.innerHTML='<div class="mc"><h2>Ты не проиграл(а) — ты тренировался!</h2><p style="font-size:17px">'+th.ic+' '+th.n+' · Побед: <b>'+run+'</b> · Рекорд: '+(meta.bestBy[th.id]||0)+' · Уровень: '+level+'</p>'
 +(newRec?'<p style="font-size:20px;color:#ffe27a">🏆 Новый рекорд!</p>':'')+'<p>'+th.over+'</p><p>Ты уже сильнее, чем в начале. Я в тебя верю!</p>'
 +'<button class="big" data-a="again">▶ Ещё раз</button><div class="row"><button data-a="menu">🗺 Сменить сюжет</button><button data-a="shop">🛒 Магазин</button><button data-a="prof">🏅 Профиль</button></div></div>';
 endEl.style.display="flex"}
function startGame(i){ac();thIdx=i;th=THEMES[i];meta.theme=i;meta.played[th.id]=1;menuEl.style.display="none";endEl.style.display="none";st="play";reset();save();chk()}
function onUI(e){const b=e.target.closest("button");if(!b)return;
 if(b.dataset.th!==undefined)startGame(+b.dataset.th);
 else if(b.dataset.a==="again")startGame(thIdx);
 else if(b.dataset.a==="menu")showMenu();
 else if(b.dataset.a==="shop")openShop();
 else if(b.dataset.a==="prof")openProf();
 else if(b.dataset.a==="mute"){setMute(!mute);b.textContent=mute?"🔇 Звук выключен":"🔊 Звук включён"}}
menuEl.onclick=onUI;endEl.onclick=onUI;
const SHOP=[
{id:"dj",n:"Двойной прыжок",d:"Прыгни ещё раз в воздухе — удобно над ямами и стенами",p:40,max:1},
{id:"rapid",n:"Быстрая зарядка луча",d:"Луч перезаряжается быстрее",p:40,max:3},
{id:"pierce",n:"Пробивной луч",d:"Луч летит насквозь и бьёт несколько проблем сразу",p:70,max:1},
{id:"hp",n:"Запас сил",d:"+20 к максимальной энергии",p:30,max:4},
{id:"kit",n:"Аптечка поддержки",d:"Сама лечит +60, когда энергия на нуле",p:25,max:9},
{id:"shield",n:"Щит поддержки",d:"Блокирует 1 удар, обновляется с уровнем",p:60,max:1}];
const price=i=>i.p+(i.id==="kit"?0:Math.round(i.p*.5*ownR(i.id)));
function renderShop(){shopEl.innerHTML='<div class="box"><h2>Магазин сил</h2><div class="cn">⭐ '+coins+'</div><span>Прыжок, удар и луч доступны всегда. Здесь — усиления.</span>'+SHOP.map(i=>{const o=ownR(i.id),mx=o>=i.max,pr=price(i);return '<div class="it"><div><b>'+i.n+(i.max>1?' ('+o+'/'+i.max+')':'')+'</b><br><span>'+i.d+'</span></div><button data-id="'+i.id+'"'+((mx||coins<pr)?' disabled':'')+'>'+(mx?'Куплено':'⭐ '+pr)+'</button></div>'}).join('')+'<button class="x" data-x="1">Закрыть</button></div>'}
function renderProf(){const done=ACH.filter(a=>meta.ach[a.id]).length;
 profEl.innerHTML='<div class="box"><h2>Профиль</h2><div class="cn">⭐ '+coins+'</div><div>Звание: <b>'+title()+'</b><br><span>Рекорд: '+meta.best+' · Уровень: '+level+' · Побед всего: '+meta.total+' · Серия: '+meta.streak+' дн.</span></div>'
 +'<h3>Задания на сегодня</h3>'+meta.quests.map(q=>'<div class="it"><div style="flex:1"><b>'+(q.d?'✅ ':'')+qText(q)+'</b><br><span>'+Math.min(q.p,q.n)+'/'+q.n+' · награда ⭐ '+q.r+'</span><div class="pb"><i style="width:'+Math.min(100,q.p/q.n*100)+'%"></i></div></div></div>').join('')
 +'<h3>Достижения ('+done+'/'+ACH.length+')</h3>'+ACH.map(a=>'<div class="it"><div><b>'+(meta.ach[a.id]?'🏅 ':'🔒 ')+a.n+'</b><br><span>Звание: «'+a.ti+'» · +10 ⭐</span></div></div>').join('')
 +'<h3>Скины героя</h3>'+SKINS.map((s,i)=>{const o2=meta.skins[i],cur=meta.skin===i;return '<div class="it"><b>'+s.n+'</b><button data-sk="'+i+'"'+(cur||(!o2&&coins<s.p)?' disabled':'')+'>'+(cur?'Надет':o2?'Надеть':'⭐ '+s.p)+'</button></div>'}).join('')
 +'<button class="x" data-x="1">Закрыть</button></div>'}
function openShop(){shopOpen=true;renderShop();shopEl.style.display="block"}
function openProf(){profOpen=true;renderProf();profEl.style.display="block"}
function closeAll(){shopOpen=profOpen=false;shopEl.style.display=profEl.style.display="none";if(st==="menu")showMenu();else if(st==="over")showEnd()}
shopEl.onclick=e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.x){closeAll();return}const i=SHOP.find(x=>x.id===b.dataset.id);if(!i)return;const pr=price(i);if(coins>=pr&&ownR(i.id)<i.max){coins-=pr;inv[i.id]=ownR(i.id)+1;save();renderShop()}};
profEl.onclick=e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.x){closeAll();return}const i=+b.dataset.sk,s=SKINS[i];if(!s)return;
 if(meta.skins[i]){meta.skin=i;save();renderProf()}else if(coins>=s.p){coins-=s.p;meta.skins[i]=1;meta.skin=i;save();renderProf()}};
skipB.onclick=skipTut;
showMenu();requestAnimationFrame(loop);
</script></body></html>
