<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Победитель — раннер</title>
<style>
html,body{height:100%;margin:0;background:#1b1535;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
canvas{display:block;width:100%;height:100%}
</style></head><body><canvas id="c"></canvas>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');
let W,H,u,GY;
function rs(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0);u=Math.max(.6,Math.min(H/520,W/700));GY=H*.76}
addEventListener('resize',rs);rs();
const NAMES=["Дедлайн","Сомнения","Лень","Страх","Критик","Усталость","Прокрастинация","Тревога","Отговорки","Неуверенность"];
const PRAISE=["Отлично!","Так держать!","Ты молодец!","Вот это сила!","Блестяще!","Ты растёшь!","Красиво!","Мощно!","У тебя получается!"];
const SOFT=["Ничего, ты справишься!","Это опыт, продолжай!","Встал(а) и дальше — ты сильнее!"];
let st="start",level=1,xp=0,energy=100,score=0,combo=0,t=0,spawn=1,cd=0,strike=0,dist=0,shake=0,flash=0,overT=0;
let probs=[],parts=[],texts=[];
const stars=Array.from({length:60},()=>({x:Math.random(),y:Math.random()*.6,r:Math.random()*1.5+.5}));
const px=()=>Math.max(90,W*.2), sc=()=>1+Math.min(level-1,12)*.07, speed=()=>(230+level*22)*u, range=()=>(95+level*10)*u, need=()=>5+level*3;
const lerp=(a,b,k)=>a+(b-a)*k, rnd=a=>a[Math.floor(Math.random()*a.length)];
function reset(){probs=[];parts=[];texts=[];energy=100;combo=0;spawn=1;xp=0;cd=0;strike=0}
function say(s,x,y,c,z){texts.push({s,x,y,c,z:z||22,l:1.3})}
function burst(x,y,c,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=(80+Math.random()*220)*u;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-80*u,l:.8,c,r:(2+Math.random()*4)*u})}}
function defeat(p,quiet){p.dead=true;burst(p.x,GY-p.h/2,rnd(["#ffd54a","#ffb36b","#fff3a8","#ff8fd0"]),quiet?10:26);if(quiet)return;combo++;score++;xp++;energy=Math.min(100,energy+7);
 say(combo>0&&combo%5===0?"Комбо ×"+combo+" — неудержим!":rnd(PRAISE),p.x,GY-p.h-30*u,"#fff2a8",22);if(xp>=need())levelUp()}
function levelUp(){level++;xp=0;energy=100;flash=1;shake=.4;probs.forEach(p=>{if(!p.dead)defeat(p,true)});
 say("Уровень "+level+"! Ты становишься сильнее!",W/2,H*.3,"#ffffff",30)}
function act(){
 if(st==="start"){st="play";reset();return}
 if(st==="over"){if(overT>.6){st="play";reset()}return}
 if(cd>0)return;strike=.22;cd=.3;
 for(const p of probs){const d=p.x-px();if(!p.dead&&d<range()&&d>-30*u){p.hp--;p.flash=1;if(p.hp<=0)defeat(p);else burst(p.x,GY-p.h/2,"#ffffff",8)}}}
addEventListener("keydown",e=>{if([" ","ArrowUp","Enter"].includes(e.key)){e.preventDefault();if(!e.repeat)act()}});
cv.addEventListener("pointerdown",e=>{e.preventDefault();act()});
function spawnP(){const hp=level>=3&&Math.random()<.3?2:1,h=(40+Math.random()*28)*u*(hp>1?1.3:1);
 probs.push({x:W+60,h,w:h*(.9+Math.random()*.3),hp,name:rnd(NAMES),ph:Math.random()*6,flash:0,dead:false})}
function update(dt){
 t+=dt;shake=Math.max(0,shake-dt);flash=Math.max(0,flash-dt*1.5);
 if(st==="play"){
  dist+=speed()*dt;cd-=dt;strike-=dt;spawn-=dt;
  if(spawn<=0){spawnP();spawn=Math.max(.65,1.5-level*.07)+Math.random()*.7}
  for(const p of probs){p.x-=speed()*dt;p.flash=Math.max(0,p.flash-dt*5);
   if(!p.dead&&p.x<px()+20*u*sc()){p.dead=true;energy-=22;combo=0;shake=.25;burst(p.x,GY-p.h/2,"#6b3fa0",16);say(rnd(SOFT),px()+60*u,GY-120*u*sc(),"#cfe8ff",18);
    if(energy<=0){st="over";overT=0}}}
  probs=probs.filter(p=>!p.dead);
 }else{dist+=speed()*dt*.3;if(st==="over")overT+=dt}
 for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*u*dt;p.l-=dt}
 parts=parts.filter(p=>p.l>0);texts.forEach(s=>{s.l-=dt;s.y-=30*u*dt});texts=texts.filter(s=>s.l>0)}
function T(){return Math.min((level-1)/9,1)}
function drawBG(){
 const k=T(),top=`hsl(${lerp(255,200,k)},${lerp(45,75,k)}%,${lerp(20,62,k)}%)`,bot=`hsl(${lerp(285,38,k)},${lerp(50,90,k)}%,${lerp(32,80,k)}%)`;
 const gr=g.createLinearGradient(0,0,0,GY);gr.addColorStop(0,top);gr.addColorStop(1,bot);g.fillStyle=gr;g.fillRect(0,0,W,H);
 g.fillStyle="#fff";stars.forEach(s=>{g.globalAlpha=(1-k)*.8;g.beginPath();g.arc(s.x*W,s.y*H,s.r,0,6.28);g.fill()});g.globalAlpha=1;
 const sy=lerp(GY+60,H*.22,k),sg=g.createRadialGradient(W*.75,sy,10,W*.75,sy,120*u);sg.addColorStop(0,"rgba(255,240,170,.95)");sg.addColorStop(1,"rgba(255,220,120,0)");
 g.fillStyle=sg;g.beginPath();g.arc(W*.75,sy,120*u,0,6.28);g.fill();
 [[.25,.5,70],[.5,.7,45]].forEach(([sp,al,amp],i)=>{g.fillStyle=`hsl(${lerp(270,130,k)},${lerp(30,45,k)}%,${lerp(18+i*8,38+i*10,k)}%)`;g.beginPath();g.moveTo(0,GY);
  for(let x=0;x<=W;x+=12)g.lineTo(x,GY-amp*u*.6-Math.sin((x+dist*sp)/(120*u)+i*2)*amp*u*.4-Math.sin((x+dist*sp)/(47*u))*8*u);g.lineTo(W,GY);g.fill()});
 g.fillStyle=`hsl(${lerp(260,110,k)},${lerp(25,40,k)}%,${lerp(14,30,k)}%)`;g.fillRect(0,GY,W,H-GY);
 g.fillStyle="rgba(255,255,255,.12)";for(let x=-((dist)%(80*u));x<W;x+=80*u)g.fillRect(x,GY+14*u,40*u,3*u)}
function drawProb(p){
 const cy=GY-p.h/2,wob=1+Math.sin(t*8+p.ph)*.05;g.save();g.translate(p.x,cy);g.scale(wob,1/wob);
 g.fillStyle=p.flash>0?"#fff":(p.hp>1?"#3a1560":"#4a2a6e");g.beginPath();g.ellipse(0,0,p.w/2,p.h/2,0,0,6.28);g.fill();
 g.strokeStyle="#8a5bd0";g.lineWidth=2;g.stroke();
 g.fillStyle="#fff";[-1,1].forEach(s=>{g.beginPath();g.arc(s*p.w*.2,-p.h*.1,p.h*.1,0,6.28);g.fill()});
 g.fillStyle="#1b0b30";[-1,1].forEach(s=>{g.beginPath();g.arc(s*p.w*.2-3,-p.h*.1,p.h*.045,0,6.28);g.fill()});
 g.strokeStyle="#1b0b30";g.lineWidth=3;[-1,1].forEach(s=>{g.beginPath();g.moveTo(s*p.w*.34,-p.h*.3+(s>0?0:0));g.lineTo(s*p.w*.08,-p.h*.2+(s>0?-6:-6)*0);g.stroke()});
 if(p.hp>1){g.fillStyle="#ffd54a";g.font=`bold ${13*u}px system-ui`;g.textAlign="center";g.fillText("×2",0,p.h*.3)}
 g.restore();
 g.font=`bold ${Math.max(12,13*u)}px system-ui,sans-serif`;g.textAlign="center";g.fillStyle="#ffe3f6";g.fillText(p.name,p.x,GY-p.h-8*u)}
function drawHero(){
 const s=sc(),x=px(),r=22*u*s,leg=16*u*s,by=GY-leg-r,k=T(),run=st==="play"?dist/(26*u):0;
 const ag=g.createRadialGradient(x,by,r*.5,x,by,r*(2+level*.18));ag.addColorStop(0,"rgba(255,225,120,.55)");ag.addColorStop(1,"rgba(255,225,120,0)");
 g.fillStyle=ag;g.beginPath();g.arc(x,by,r*(2+level*.18),0,6.28);g.fill();
 g.strokeStyle="#2b2350";g.lineWidth=5*u;g.lineCap="round";
 [0,Math.PI].forEach(o=>{g.beginPath();g.moveTo(x,by+r*.7);g.lineTo(x+Math.sin(run+o)*leg*.9,GY-(Math.max(0,Math.cos(run+o))*5*u));g.stroke()});
 g.strokeStyle=`hsl(${lerp(350,45,k)},90%,60%)`;g.lineWidth=7*u*s;g.beginPath();g.moveTo(x-r*.5,by-r*.3);
 for(let i=1;i<=6;i++)g.lineTo(x-r*.5-i*9*u*s,by-r*.3+Math.sin(t*10-i)*4*u+i*1.5*u);g.stroke();
 const bg=g.createLinearGradient(x,by-r,x,by+r);bg.addColorStop(0,`hsl(${lerp(200,48,k)},90%,70%)`);bg.addColorStop(1,`hsl(${lerp(215,28,k)},85%,55%)`);
 g.fillStyle=bg;g.beginPath();g.arc(x,by,r,0,6.28);g.fill();g.strokeStyle="#fff";g.lineWidth=2;g.stroke();
 g.fillStyle="#1b1535";[-1,1].forEach(q=>{g.beginPath();g.arc(x+r*.25+q*r*.28,by-r*.15,r*.1,0,6.28);g.fill()});
 g.strokeStyle="#1b1535";g.lineWidth=2.5;g.beginPath();g.arc(x+r*.25,by+r*.05,r*.35,.2,Math.PI-.2);g.stroke();
 if(level>=5){g.fillStyle="#ffd54a";g.beginPath();g.moveTo(x-r*.6,by-r*.85);g.lineTo(x-r*.5,by-r*1.4);g.lineTo(x-r*.2,by-r*1.0);g.lineTo(x,by-r*1.5);g.lineTo(x+r*.2,by-r*1.0);g.lineTo(x+r*.5,by-r*1.4);g.lineTo(x+r*.6,by-r*.85);g.closePath();g.fill()}
 if(st==="play"){g.strokeStyle="rgba(255,255,255,.3)";g.lineWidth=3;g.beginPath();g.moveTo(x+r,GY+4);g.lineTo(x+range(),GY+4);g.stroke()}
 if(strike>0){const f=1-strike/.22;g.strokeStyle=`rgba(255,235,130,${1-f*.6})`;g.lineWidth=(10-f*6)*u;g.beginPath();g.arc(x,by,r+(range()-r)*(.4+f*.6),-.9,.9);g.stroke()}}
function ctext(s,x,y,sz,c,w){g.font=`${w||"bold"} ${sz}px system-ui,sans-serif`;g.textAlign="center";g.fillStyle=c;g.fillText(s,x,y)}
function bar(x,y,w,h,f,c,l){g.fillStyle="rgba(0,0,0,.35)";g.fillRect(x,y,w,h);g.fillStyle=c;g.fillRect(x,y,w*Math.max(0,Math.min(1,f)),h);g.font="bold 12px system-ui";g.textAlign="left";g.fillStyle="#fff";g.fillText(l,x+w+8,y+h-1)}
function hud(){const top=Math.max(24,parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--sat"))||0)+14;
 g.textAlign="left";g.font="bold 18px system-ui";g.fillStyle="#fff";g.fillText("Уровень "+level,16,top+8);
 bar(16,top+18,150,10,xp/need(),"#ffd54a","рост");bar(16,top+36,150,10,energy/100,"#6be3a0","энергия");
 g.textAlign="right";g.font="bold 16px system-ui";g.fillStyle="#fff";g.fillText("Побеждено: "+score,W-16,top+8);
 if(combo>=3)g.fillText("Комбо ×"+combo,W-16,top+30)}
function overlay(a){g.fillStyle=`rgba(15,10,35,${a})`;g.fillRect(0,0,W,H)}
function draw(){
 g.save();if(shake>0)g.translate((Math.random()-.5)*10*shake*u,(Math.random()-.5)*10*shake*u);
 drawBG();probs.forEach(drawProb);drawHero();
 parts.forEach(p=>{g.globalAlpha=Math.max(0,p.l/.8);g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,p.r,0,6.28);g.fill()});g.globalAlpha=1;
 texts.forEach(s=>{g.globalAlpha=Math.min(1,s.l*1.5);ctext(s.s,s.x,s.y,s.z*Math.max(.8,u),s.c);g.globalAlpha=1});
 if(flash>0){g.fillStyle=`rgba(255,245,200,${flash*.6})`;g.fillRect(0,0,W,H)}
 g.restore();
 if(st!=="start")hud();
 if(st==="start"){overlay(.55);ctext("Победитель",W/2,H*.32,Math.min(56,W/8),"#ffe27a");
  ctext("Ты бежишь не от проблем — ты их побеждаешь.",W/2,H*.42,Math.min(20,W/20),"#fff","normal");
  ctext("С каждой победой ты сильнее, а мир вокруг — светлее.",W/2,H*.47,Math.min(20,W/20),"#fff","normal");
  ctext("Пробел или касание — удар по проблеме",W/2,H*.58,16,"#cfe8ff","normal");
  ctext("▶ Нажми, чтобы начать",W/2,H*.7+Math.sin(t*4)*4,24,"#ffffff")}
 if(st==="over"){overlay(.6);ctext("Ты не проиграл(а) — ты тренировался!",W/2,H*.34,Math.min(34,W/14),"#ffe27a");
  ctext("Уровень "+level+" · побеждено проблем: "+score,W/2,H*.44,20,"#fff","normal");
  ctext("Ты уже сильнее, чем в начале. Я в тебя верю!",W/2,H*.5,18,"#cfe8ff","normal");
  if(overT>.6)ctext("▶ Нажми и снова в бой",W/2,H*.65+Math.sin(t*4)*4,24,"#fff")}}
let last=performance.now();
function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
