function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;update(dt);draw();mb.style.display=st==="play"?"block":"none";const sh=st==="play"&&tut<9;if(sh!==skipShown){skipShown=sh;skipB.style.display=sh?"block":"none"}requestAnimationFrame(loop)}

const menuEl=document.getElementById("menu"),endEl=document.getElementById("endm"),shopEl=document.getElementById("shop"),profEl=document.getElementById("prof");
function evHTML(){const E=EV(),ek=tdKey(),ep=meta.ev.k===ek?meta.ev.p:0,ed=meta.ev.k===ek&&meta.ev.done,mk=mKey(),hb=meta.hm.m===mk?meta.hm.b:0,got=meta.hmGot[mk],H2=HMN();
 const box=(bg,html)=>'<div style="background:'+bg+';border-radius:14px;padding:8px 12px;margin:6px auto;max-width:620px;text-align:left;font-size:14px;line-height:1.35">'+html+'</div>';
 return box("linear-gradient(90deg,#ff7a59,#c2459a)",E.ic+' <b>Событие дня: '+E.n+'</b> — '+E.d+'<br>'+(ed?'✅ Цель выполнена! Завтра новое событие':'🎯 Победи '+EVG+' проблем сегодня: <b>'+ep+'/'+EVG+'</b> → сундук +120 ⭐')+'<div class="pb" style="margin-top:4px"><i style="width:'+Math.min(100,ep/EVG*100)+'%"></i></div>')
  +box("linear-gradient(90deg,#3a6ad9,#7a4ad9)",'👑 <b>Герой месяца: «'+H2.n+'»</b> — '+(got?'✅ получен! Надень в профиле':'победи '+HMB+' боссов в этом месяце: <b>'+Math.min(hb,HMB)+'/'+HMB+'</b>')+' · осталось '+daysLeft()+' дн.')}
function showMenu(){st="menu";endEl.style.display="none";
 menuEl.innerHTML='<div class="mc"><h1>Победитель</h1><p>Ты бежишь не от проблем — ты их побеждаешь.</p><p style="opacity:.85">Звание: <b>'+title()+'</b> · Рекорд: '+meta.best+' · Уровень: '+level+' · ⭐ '+coins+'</p>'
 +(dailyMsg?'<p style="color:#9ff5c0">🎁 '+dailyMsg+'</p>':'')+evHTML()+'<p style="margin-top:10px;font-weight:bold">Выбери сюжет:</p><div class="cards">'
 +THEMES.map((T,i)=>'<button class="card" data-th="'+i+'" style="background:linear-gradient(160deg,'+T.c[0]+','+T.c[1]+')"><i>'+T.ic+'</i><b>'+T.n+'</b><span>'+T.tag+'</span><span>рекорд: '+(meta.bestBy[T.id]||0)+'</span></button>').join('')
 +'</div><p style="font-size:13px;opacity:.85">'+(meta.tut?'Кнопки: ⬆️ ПРЫЖОК · ⬇️ ПОДКАТ · 👊 КУЛАК · ⚽ БРОСОК · 🔥 СУПЕР':'Сначала короткое обучение (его можно пропустить)')+'</p><div class="row" style="margin-bottom:6px">'+["👦 Мальчик","👧 Девочка","🎒 Школьник","🎒 Школьница"].map((n,i)=>'<button data-a="hero'+i+'" style="'+((meta.hero||0)===i?'outline:3px solid #fff':'opacity:.7')+'">'+n+'</button>').join("")+'</div><div class="row" style="margin-bottom:6px"><button data-a="wp0" style="'+(meta.weapon!==1?'outline:3px solid #fff':'opacity:.7')+'">⚽ Мячик</button><button data-a="wp1" style="'+(meta.weapon===1?'outline:3px solid #fff':'opacity:.7')+'">🍳 Сковородка</button></div><div class="row"><button data-a="bes">📖 Коллекция</button><button data-a="shop">🛒 Магазин</button><button data-a="prof">🏅 Профиль и задания</button><button data-a="mute">'+(mute?"🔇 Звук выключен":"🔊 Звук включён")+'</button></div></div>';
 menuEl.style.display="flex"}
let endAt=0;function showEnd(){endAt=performance.now();menuEl.style.display="none";
 endEl.innerHTML='<div class="mc"><h2>Ты не проиграл(а) — ты тренировался!</h2><p style="font-size:17px">'+th.ic+' '+th.n+' · Побед: <b>'+run+'</b> · Рекорд: '+(meta.bestBy[th.id]||0)+' · Уровень: '+level+'</p>'
 +(newRec?'<p style="font-size:20px;color:#ffe27a">🏆 Новый рекорд!</p>':((meta.bestBy[th.id]||0)-run>0&&(meta.bestBy[th.id]||0)-run<=10?'<p style="color:#ffd9a0">Почти! До рекорда не хватило '+((meta.bestBy[th.id]||0)-run)+' побед</p>':''))+(need()-xp<=4?'<p style="color:#9ff5c0">До следующего уровня: '+(need()-xp)+' побед</p>':'')+'<p>'+th.over+'</p><p>Ты уже сильнее, чем в начале. Я в тебя верю!</p>'
 +'<button class="big" data-a="again" style="font-size:26px;padding:18px 44px">▶ Ещё раз</button><p style="font-size:12px;opacity:.7;margin:10px 0 4px">коснись в любом месте, чтобы играть снова</p><div class="row" style="opacity:.75;transform:scale(.85);margin-top:14px"><button data-a="menu">🗺 Сюжет</button><button data-a="shop">🛒</button><button data-a="prof">🏅</button></div></div>';
 endEl.style.display="flex"}
function startGame(i){ac();thIdx=i;th=THEMES[i];meta.theme=i;meta.played[th.id]=1;menuEl.style.display="none";endEl.style.display="none";st="play";reset();zShownL=0;zIntro();save();chk()}
function onUI(e){const b=e.target.closest("button");if(!b){if(endEl.style.display==="flex"&&performance.now()-endAt>700)startGame(thIdx);return}
 if(b.dataset.th!==undefined)startGame(+b.dataset.th);
 else if(b.dataset.a==="again")startGame(thIdx);
 else if(b.dataset.a==="menu")showMenu();
 else if(b.dataset.a==="wp0"||b.dataset.a==="wp1"){meta.weapon=+b.dataset.a.slice(2);save();showMenu()}
 else if(/^hero\d$/.test(b.dataset.a)){meta.hero=+b.dataset.a.slice(4);save();showMenu()}
 else if(b.dataset.a==="shop")openShop();
 else if(b.dataset.a==="prof")openProf();
 else if(b.dataset.a==="bes")openBes();
 else if(b.dataset.a==="mute"){setMute(!mute);b.textContent=mute?"🔇 Звук выключен":"🔊 Звук включён"}}
menuEl.onclick=onUI;endEl.onclick=onUI;
const SHOP=[
{id:"dj",n:"Двойной прыжок",d:"Прыгни ещё раз в воздухе — удобно над ямами и стенами",p:40,max:1},
{id:"rapid",n:"Быстрая зарядка шарика",d:"Шарик перезаряжается быстрее",p:40,max:3},
{id:"pierce",n:"Пробивной шарик",d:"Шарик летит насквозь и бьёт несколько проблем сразу",p:70,max:1},
{id:"hp",n:"Запас сил",d:"+20 к максимальной энергии",p:30,max:4},
{id:"kit",n:"Аптечка поддержки",d:"Сама лечит +60, когда энергия на нуле",p:25,max:9},
{id:"shield",n:"Щит поддержки",d:"Блокирует 1 удар, обновляется с уровнем",p:60,max:1}];
const price=i=>i.p+(i.id==="kit"?0:Math.round(i.p*.5*ownR(i.id)));
function renderShop(){shopEl.innerHTML='<div class="box"><h2>Магазин сил</h2><div class="cn">⭐ '+coins+'</div><span>Прыжок, удар и шарик доступны всегда. Здесь — усиления.</span>'+SHOP.map(i=>{const o=ownR(i.id),mx=o>=i.max,pr=price(i);return '<div class="it"><div><b>'+i.n+(i.max>1?' ('+o+'/'+i.max+')':'')+'</b><br><span>'+i.d+'</span></div><button data-id="'+i.id+'"'+((mx||coins<pr)?' disabled':'')+'>'+(mx?'Куплено':'⭐ '+pr)+'</button></div>'}).join('')+'<button class="x" data-x="1">Закрыть</button></div>'}
function renderProf(){const done=ACH.filter(a=>meta.ach[a.id]).length;
 profEl.innerHTML='<div class="box"><h2>Профиль</h2><div class="cn">⭐ '+coins+'</div><div>Звание: <b>'+title()+'</b><br><span>Рекорд: '+meta.best+' · Уровень: '+level+' · Побед всего: '+meta.total+' · Серия: '+meta.streak+' дн.</span></div>'
 +'<h3>Задания на сегодня</h3>'+meta.quests.map(q=>'<div class="it"><div style="flex:1"><b>'+(q.d?'✅ ':'')+qText(q)+'</b><br><span>'+Math.min(q.p,q.n)+'/'+q.n+' · награда ⭐ '+Math.round(q.r*(q.m||1))+'</span><div class="pb"><i style="width:'+Math.min(100,q.p/q.n*100)+'%"></i></div></div></div>').join('')
 +'<h3>Достижения ('+done+'/'+ACH.length+')</h3>'+ACH.map(a=>'<div class="it"><div><b>'+(meta.ach[a.id]?'🏅 ':'🔒 ')+a.n+'</b><br><span>Звание: «'+a.ti+'» · +10 ⭐</span></div></div>').join('')
 +'<h3>Скины героя</h3>'+SKINS.map((s,i)=>{const o2=meta.skins[i],cur=meta.skin===i;return '<div class="it"><b>'+s.n+'</b><button data-sk="'+i+'"'+(cur||(!o2&&coins<s.p)?' disabled':'')+'>'+(cur?'Надет':o2?'Надеть':'⭐ '+s.p)+'</button></div>'}).join('')
 +'<button class="x" data-x="1">Закрыть</button></div>'}

besEl.onclick=e=>{const b=e.target.closest("button");if(b&&b.dataset.x){besEl.style.display="none"}};

 if(meta.skins[i]){meta.skin=i;save();renderProf()}else if(coins>=s.p){coins-=s.p;meta.skins[i]=1;meta.skin=i;save();renderProf()}};
